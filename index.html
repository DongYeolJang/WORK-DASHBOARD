<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="업무 대시보드">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>업무 대시보드</title>
<script>
(function(){
  const c=document.createElement('canvas');c.width=512;c.height=512;
  const x=c.getContext('2d');
  const rr=(cx,cy,w,h,r)=>{x.beginPath();x.moveTo(cx+r,cy);x.lineTo(cx+w-r,cy);x.quadraticCurveTo(cx+w,cy,cx+w,cy+r);x.lineTo(cx+w,cy+h-r);x.quadraticCurveTo(cx+w,cy+h,cx+w-r,cy+h);x.lineTo(cx+r,cy+h);x.quadraticCurveTo(cx,cy+h,cx,cy+h-r);x.lineTo(cx,cy+r);x.quadraticCurveTo(cx,cy,cx+r,cy);x.closePath();};
  rr(0,0,512,512,112);x.fillStyle='#1a1a1a';x.fill();
  [[80,80,1],[284,80,.45],[80,284,.45],[284,284,.25]].forEach(([tx,ty,a])=>{x.globalAlpha=a;x.fillStyle='#5B8DEF';rr(tx,ty,148,148,24);x.fill();});
  x.globalAlpha=.9;x.fillStyle='#fff';rr(108,136,92,10,5);x.fill();
  x.globalAlpha=.5;rr(108,156,60,8,4);x.fill();
  x.globalAlpha=1;x.fillStyle='#53B99A';x.beginPath();x.arc(108,108,12,0,Math.PI*2);x.fill();
  const png=c.toDataURL('image/png');
  window._iconPng=png;
  let lk=document.querySelector("link[rel='apple-touch-icon']");
  if(!lk){lk=document.createElement('link');lk.rel='apple-touch-icon';document.head.appendChild(lk);}
  lk.href=png;
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f7f7f5;--surface:#fff;--surface2:#f9f9f7;--border:#e8e8e8;--border2:#d0d0d0;
  --text:#1a1a1a;--text2:#666;--text3:#aaa;--accent:#1a1a1a;--accent-text:#fff;
  --sidebar-bg:#fff;--sidebar-border:#e0e0e0;--hover:#f5f5f5;--radius:8px;
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{--bg:#111;--surface:#1e1e1e;--surface2:#252525;--border:#333;--border2:#444;--text:#f0f0f0;--text2:#aaa;--text3:#666;--accent:#5B8DEF;--accent-text:#fff;--sidebar-bg:#161616;--sidebar-border:#2a2a2a;--hover:#2a2a2a;}
[data-theme="blue"]{--bg:#eef3fb;--surface:#fff;--surface2:#f0f5ff;--border:#d0ddf5;--border2:#b8cdf0;--text:#1a2a4a;--text2:#4a6090;--text3:#8aa0c8;--accent:#2563eb;--accent-text:#fff;--sidebar-bg:#1e3a8a;--sidebar-border:#2d4fa0;--hover:#e8eeff;}
[data-theme="green"]{--bg:#edf7f0;--surface:#fff;--surface2:#f0faf3;--border:#c8e6d0;--border2:#a8d8b8;--text:#1a3a28;--text2:#3a7050;--text3:#80b890;--accent:#16a34a;--accent-text:#fff;--sidebar-bg:#14532d;--sidebar-border:#1e6b3e;--hover:#e0f5e8;}
[data-theme="warm"]{--bg:#fdf8f3;--surface:#fff;--surface2:#fef9f5;--border:#ecddd0;--border2:#dcc8b8;--text:#3a2010;--text2:#805030;--text3:#c09070;--accent:#c2410c;--accent-text:#fff;--sidebar-bg:#431407;--sidebar-border:#5c1e0a;--hover:#fdf0e8;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:13px;transition:background .2s,color .2s}

/* Auth */
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.auth-card{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:360px}
.auth-logo{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text)}
.auth-sub{font-size:12px;color:var(--text3);margin-bottom:22px}
.auth-tabs{display:flex;margin-bottom:18px;border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
.auth-tab{flex:1;padding:8px 0;text-align:center;font-size:12px;cursor:pointer;background:var(--surface);border:none;color:var(--text3);transition:all .15s}
.auth-tab.active{background:var(--accent);color:var(--accent-text)}
.auth-field{margin-bottom:12px}
.auth-field label{font-size:10px;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.auth-field input{width:100%;border:0.5px solid var(--border2);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;background:var(--surface);color:var(--text)}
.auth-btn{width:100%;background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.auth-err{font-size:11px;color:#e53935;margin-top:8px;min-height:16px;text-align:center}

/* Layout */
#app-shell{display:none;flex:1;overflow:hidden;flex-direction:row}
#app-shell.mobile{flex-direction:column}
.sidebar{background:var(--sidebar-bg);border-right:0.5px solid var(--sidebar-border);display:flex;flex-direction:column;align-items:center;padding:calc(12px + var(--safe-top)) 0 12px;gap:4px;flex-shrink:0;width:52px;transition:background .2s}
#app-shell.mobile .sidebar{display:none}
.mobile-nav{display:none;background:var(--sidebar-bg);border-top:0.5px solid var(--sidebar-border);flex-shrink:0;padding:0 0 var(--safe-bottom);justify-content:space-around;align-items:center;height:calc(54px + var(--safe-bottom))}
#app-shell.mobile .mobile-nav{display:flex}
.nav-btn{width:36px;height:36px;border:none;background:none;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .15s;flex-direction:column;gap:3px}
.nav-btn:hover{background:var(--hover)}
.nav-btn.active{background:var(--accent);color:var(--accent-text)}
#app-shell.mobile .nav-btn{width:48px;height:44px;border-radius:10px}
#app-shell.mobile .nav-btn.active{background:transparent;color:var(--accent)}
.nav-label{font-size:9px;color:inherit;line-height:1;display:none}
#app-shell.mobile .nav-label{display:block}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:8px}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tab-content{display:none;flex:1;overflow:hidden}
.tab-content.active{display:flex}
#tab-project{gap:0}
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#app-shell.mobile #tab-project{flex-direction:column}
#app-shell.mobile .panel-divider{width:100%;height:0.5px}
#app-shell.mobile .panel{min-height:180px;max-height:50%}
.panel-header{padding:10px 14px 8px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface);gap:8px;flex-wrap:wrap}
#app-shell.mobile .panel-header{padding:8px 12px 6px;padding-top:calc(8px + var(--safe-top))}
.panel-title{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;white-space:nowrap}
.panel-divider{width:0.5px;background:var(--border);flex-shrink:0}
.panel-body{overflow-y:auto;flex:1;padding:8px 10px 16px;background:var(--bg)}
.add-btn{width:22px;height:22px;border:0.5px solid var(--border2);border-radius:6px;background:var(--surface);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text2);line-height:1;flex-shrink:0}
.add-btn:hover{background:var(--hover)}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:0.5px solid var(--border);background:var(--surface);overflow-x:auto;flex-shrink:0}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{font-size:10px;padding:3px 9px;border-radius:20px;border:0.5px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.filter-chip.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.filter-chip:hover{background:var(--hover)}

/* Status */
.status-section{margin-bottom:10px}
.status-hdr{display:flex;align-items:center;gap:6px;margin-bottom:5px;cursor:pointer;user-select:none}
.status-label{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.s-active{background:#e8f5e9;color:#2e7d32}
.s-done{background:#e3f2fd;color:#1565c0}
.s-hold{background:#fff8e1;color:#e65100}
.s-issue{background:#fce4ec;color:#b71c1c}
.s-prev{background:#f3e5f5;color:#6a1b9a}
[data-theme="dark"] .s-active{background:#1b3a1e;color:#81c784}
[data-theme="dark"] .s-done{background:#0d2a45;color:#64b5f6}
[data-theme="dark"] .s-hold{background:#3a2a00;color:#ffb74d}
[data-theme="dark"] .s-issue{background:#3a0d0d;color:#ef9a9a}
[data-theme="dark"] .s-prev{background:#2a1040;color:#ce93d8}
.toggle-arrow{font-size:10px;color:var(--text3);transition:transform .15s}
.toggle-arrow.collapsed{transform:rotate(-90deg)}

/* Project rows */
.proj-row{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:5px;overflow:hidden;border-left:3px solid transparent}
.proj-row-header{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none}
.proj-row-header:hover{background:var(--hover)}
#app-shell.mobile .proj-row-header{padding:10px}
.proj-cat-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.proj-name-text{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
#app-shell.mobile .proj-name-text{font-size:13px}
.proj-expand{font-size:11px;color:var(--text3);transition:transform .15s;flex-shrink:0}
.proj-expand.open{transform:rotate(90deg)}
.proj-row-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.action-btn{background:none;border:0.5px solid var(--border);border-radius:5px;padding:2px 6px;font-size:10px;color:var(--text2);cursor:pointer}
.action-btn:hover{background:var(--hover)}
.proj-detail{border-top:0.5px solid var(--border);padding:8px 10px 10px;background:var(--surface2)}
.proj-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11px;margin-bottom:8px}
.proj-detail-item{display:flex;flex-direction:column;gap:1px}
.proj-detail-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.proj-detail-val{color:var(--text2);line-height:1.4}
.proj-number-tag{font-family:monospace;font-size:10px;background:var(--surface);border:0.5px solid var(--border);padding:1px 5px;border-radius:3px;color:var(--text3)}

/* Subtasks */
.subtask-list{margin-bottom:6px}
.subtask-group-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:4px 0 3px;font-weight:600}
.subtask-item{background:var(--surface);border:0.5px solid var(--border);border-radius:6px;padding:5px 8px;margin-bottom:3px;display:flex;align-items:flex-start;gap:7px}
.subtask-drag{cursor:grab;color:var(--text3);font-size:11px;flex-shrink:0;margin-top:1px}
.subtask-check{width:13px;height:13px;border:1px solid var(--border2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.subtask-check.done{background:var(--accent);border-color:var(--accent)}
.subtask-check.done::after{content:'';display:block;width:7px;height:4px;border-left:1.5px solid var(--accent-text);border-bottom:1.5px solid var(--accent-text);transform:rotate(-45deg) translate(1px,-1px)}
.subtask-info{flex:1;min-width:0}
.subtask-cat{font-size:9px;color:var(--text3);margin-bottom:1px}
.subtask-text{font-size:11px;line-height:1.4;color:var(--text)}
.subtask-text.done{text-decoration:line-through;color:var(--text3)}
.subtask-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0}
.subtask-del:hover{color:#e53935}
.subtask-add-row{display:flex;gap:5px;align-items:center}
.subtask-input-sm{border:0.5px solid var(--border);border-radius:5px;padding:4px 7px;font-size:11px;background:var(--surface);outline:none;width:72px;color:var(--text)}
.subtask-input-lg{border:0.5px solid var(--border);border-radius:5px;padding:4px 7px;font-size:11px;background:var(--surface);outline:none;flex:1;min-width:50px;color:var(--text)}
.subtask-add-btn{background:var(--accent);border:none;border-radius:5px;color:var(--accent-text);font-size:11px;padding:4px 9px;cursor:pointer;white-space:nowrap}

/* Today */
.today-date-nav{display:flex;align-items:center;gap:5px}
.date-nav-btn{background:none;border:0.5px solid var(--border);border-radius:5px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--text2);flex-shrink:0}
.date-nav-today{font-size:9px;background:none;border:0.5px solid var(--border);border-radius:5px;padding:0 6px;height:22px;cursor:pointer;color:var(--text2)}
.date-label{font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap}
.date-today-badge{font-size:9px;background:var(--accent);color:var(--accent-text);padding:1px 5px;border-radius:3px;margin-left:3px}
.today-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:5px;display:flex;align-items:flex-start;gap:8px;border-left:3px solid transparent}
#app-shell.mobile .today-card{padding:10px}
.today-check{width:14px;height:14px;border:1px solid var(--border2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.today-check.checked{background:var(--accent);border-color:var(--accent)}
.today-check.checked::after{content:'';display:block;width:8px;height:5px;border-left:1.5px solid var(--accent-text);border-bottom:1.5px solid var(--accent-text);transform:rotate(-45deg) translate(1px,-1px)}
.today-text{font-size:12px;line-height:1.4;color:var(--text)}
.today-text.checked{text-decoration:line-through;color:var(--text3)}
#app-shell.mobile .today-text{font-size:14px}
.today-proj-tag{font-size:9px;padding:2px 6px;border-radius:3px;margin-top:3px;display:inline-block;font-weight:500}
.drop-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:12px;text-align:center;font-size:11px;color:var(--text3);margin-top:4px;transition:all .15s}
.drop-zone.drag-over{border-color:var(--text2);background:var(--hover)}

/* Calendar */
#tab-calendar{flex-direction:column;background:var(--surface)}
.cal-header{padding:10px 14px 8px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface)}
#app-shell.mobile .cal-header{padding-top:calc(10px + var(--safe-top))}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav button{background:none;border:0.5px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.cal-month{font-size:14px;font-weight:600;color:var(--text)}
.cal-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cal-grid-wrap{padding:8px 10px 0;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cal-day-hdr{background:var(--surface2);text-align:center;font-size:10px;color:var(--text3);padding:4px 0;font-weight:500}
.cal-cell{background:var(--surface);min-height:64px;padding:3px;cursor:pointer;transition:background .1s;overflow:hidden}
#app-shell.mobile .cal-cell{min-height:52px}
.cal-cell:hover{background:var(--hover)}
.cal-cell.selected{outline:2px solid var(--accent);outline-offset:-2px}
.cal-cell.other-month .cal-date{color:var(--text3)}
.cal-cell.today .cal-date{background:var(--accent);color:var(--accent-text);border-radius:50%}
.cal-date{font-size:11px;font-weight:500;color:var(--text);margin-bottom:2px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* 캘린더 셀 이벤트 미리보기 */
.cal-evt-preview{font-size:9px;padding:1px 4px;border-radius:2px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.cal-body-inner{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cal-detail{border-top:0.5px solid var(--border);padding:10px 14px;overflow-y:auto;flex:1;background:var(--bg)}
.cal-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-detail-title{font-size:13px;font-weight:600;color:var(--text)}
.cal-detail-empty{font-size:12px;color:var(--text3);text-align:center;padding:20px 0}
.cal-detail-item{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;border-left:3px solid transparent}
.cal-detail-item-title{font-size:12px;font-weight:500;color:var(--text)}
.cal-detail-actions{display:flex;gap:4px;flex-shrink:0}
.cal-detail-btn{background:none;border:0.5px solid var(--border);border-radius:5px;padding:2px 7px;font-size:10px;color:var(--text2);cursor:pointer}
.cal-detail-btn:hover{background:var(--hover)}
.cal-detail-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 2px;flex-shrink:0}
.cal-detail-del:hover{color:#e53935}

/* Timesheet */
#tab-timesheet{flex-direction:column;background:var(--surface)}
.ts-header{padding:10px 16px 8px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;flex-shrink:0;background:var(--surface)}
#app-shell.mobile .ts-header{padding-top:calc(10px + var(--safe-top))}
.ts-body{flex:1;overflow-y:auto;padding:10px 14px;background:var(--bg)}
#app-shell.mobile .ts-body{padding:8px 10px}
.ts-form{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.ts-row1{display:grid;grid-template-columns:130px 80px 1fr 70px;gap:8px;align-items:end;margin-bottom:8px}
.ts-row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:8px}
#app-shell.mobile .ts-row1{grid-template-columns:1fr 1fr;gap:8px}
#app-shell.mobile .ts-row2{grid-template-columns:1fr}
.ts-form label{font-size:10px;color:var(--text3);margin-bottom:3px;display:block;text-transform:uppercase;letter-spacing:.04em}
.ts-form input,.ts-form select,.ts-form textarea{width:100%;border:0.5px solid var(--border2);border-radius:6px;padding:6px 8px;font-size:12px;background:var(--surface);outline:none;font-family:inherit;color:var(--text)}
#app-shell.mobile .ts-form input,#app-shell.mobile .ts-form select{padding:8px 10px;font-size:14px}
.ts-form textarea{resize:none;height:34px;line-height:1.4}
.ts-add-btn{background:var(--accent);border:none;border-radius:6px;color:var(--accent-text);font-size:12px;font-weight:500;padding:0 16px;height:34px;cursor:pointer;white-space:nowrap}
#app-shell.mobile .ts-add-btn{width:100%;height:42px;font-size:14px;margin-top:4px}
.ts-completed-wrap{margin-bottom:8px}
.ts-completed-list{background:var(--surface);border:0.5px solid var(--border);border-radius:6px;overflow:hidden}
.ts-completed-label{font-size:10px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ts-completed-item{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:0.5px solid var(--border);transition:background .1s}
.ts-completed-item:last-child{border-bottom:none}
.ts-completed-item:hover,.ts-completed-item.selected{background:var(--hover)}
.ts-completed-check{width:12px;height:12px;border:1.5px solid var(--text2);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ts-completed-check::after{content:'';display:block;width:6px;height:3.5px;border-left:1.5px solid var(--text2);border-bottom:1.5px solid var(--text2);transform:rotate(-45deg) translate(1px,-0.5px)}
.ts-completed-text{font-size:11px;flex:1;color:var(--text)}
.ts-hours-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:0.5px solid var(--border);border-radius:6px;padding:7px 10px}
.ts-bar-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.ts-bar-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}
.ts-bar-label{font-size:11px;color:var(--text3);white-space:nowrap;min-width:78px;text-align:right}
.ts-bar-label b{color:var(--text)}
.ts-table{width:100%;border-collapse:collapse}
.ts-table th{font-size:10px;color:var(--text3);font-weight:500;padding:5px 8px;text-align:left;border-bottom:0.5px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.ts-table td{font-size:12px;padding:7px 8px;border-bottom:0.5px solid var(--border);vertical-align:middle;color:var(--text)}
#app-shell.mobile .ts-table th{font-size:9px;padding:4px 5px}
#app-shell.mobile .ts-table td{font-size:11px;padding:6px 5px}
.ts-table tr:hover td{background:var(--hover)}
.ts-total{margin-top:8px;text-align:right;font-size:12px;color:var(--text3)}
.ts-total span{font-weight:600;color:var(--text)}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 2px}
.del-btn:hover{color:#e53935}
.icon-btn{background:none;border:0.5px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:4px}
.icon-btn:hover{background:var(--hover)}

/* Settings */
#tab-settings{flex-direction:column;background:var(--bg)}
.settings-header{padding:12px 16px 10px;border-bottom:0.5px solid var(--border);background:var(--surface);flex-shrink:0}
#app-shell.mobile .settings-header{padding-top:calc(12px + var(--safe-top))}
.settings-body{flex:1;overflow-y:auto;padding:16px 14px}
.settings-section{margin-bottom:24px}
.settings-section-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.settings-card{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;overflow:hidden}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:0.5px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:13px;color:var(--text);font-weight:500}
.settings-row-desc{font-size:11px;color:var(--text3);margin-top:2px}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.theme-btn{border:2px solid transparent;border-radius:10px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;background:var(--surface)}
.theme-btn.active{border-color:var(--accent)}
.theme-preview{width:32px;height:32px;border-radius:8px;border:0.5px solid var(--border)}
.theme-btn-label{font-size:10px;color:var(--text2);font-weight:500}
.seg-control{display:flex;border:0.5px solid var(--border);border-radius:7px;overflow:hidden}
.seg-btn{flex:1;padding:6px 12px;font-size:12px;border:none;background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit}
.seg-btn.active{background:var(--accent);color:var(--accent-text)}
.settings-user{display:flex;align-items:center;gap:12px;padding:14px}
.user-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent-text);flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:600;color:var(--text)}
.user-email{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn-full{background:none;border:0.5px solid #e53935;color:#e53935;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;width:100%;font-family:inherit;margin-top:8px}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#53B99A;flex-shrink:0}
.sync-dot.syncing{background:#F2AE3D;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:300;padding-bottom:var(--safe-bottom)}
#app-shell.desktop .modal-overlay{align-items:center}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:16px 18px calc(16px + var(--safe-bottom));width:100%;max-width:100vw;max-height:92vh;overflow-y:auto}
#app-shell.desktop .modal{border-radius:14px;width:440px;max-width:92vw;padding:18px 20px}
.modal h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text)}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px}
#app-shell.desktop .modal-drag{display:none}
.form-row{margin-bottom:10px}
.form-row label{font-size:10px;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-row input,.form-row select{width:100%;border:0.5px solid var(--border2);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;background:var(--surface);color:var(--text)}
.form-row textarea{width:100%;border:0.5px solid var(--border2);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;background:var(--surface);color:var(--text);resize:none;height:60px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn-cancel{background:none;border:0.5px solid var(--border2);border-radius:8px;padding:10px 18px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit}
.btn-save{background:var(--accent);border:none;border-radius:8px;padding:10px 18px;font-size:13px;cursor:pointer;color:var(--accent-text);font-weight:600;font-family:inherit}

/* Member tags */
.member-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;min-height:28px}
.member-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:0.5px solid var(--border);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--text2)}
.member-tag button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;line-height:1;padding:0}
.member-add-row{display:flex;gap:6px}
.member-add-row input{flex:1;border:0.5px solid var(--border2);border-radius:6px;padding:7px 9px;font-size:12px;background:var(--surface);outline:none;color:var(--text)}
.member-add-row button{background:var(--accent);border:none;border-radius:6px;color:var(--accent-text);font-size:11px;padding:0 10px;cursor:pointer;white-space:nowrap}
</style>
</head>

  const sw=`const C='wd-v1',A=['./','.index.html'];self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(A)).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(c=>{if(c)return c;return fetch(e.request).then(r=>{if(r&&r.status===200&&r.type==='basic')caches.open(C).then(ch=>ch.put(e.request,r.clone()));return r}).catch(()=>c)}))});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  window.addEventListener('load',()=>navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{}));
}

// ── Theme & Layout ──
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t==='light'?'':t);
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('theme-'+t);if(el)el.classList.add('active');
  localStorage.setItem('theme',t);
}
function setLayout(l){
  const s=document.getElementById('app-shell');s.className=l;
  document.getElementById('seg-desktop').classList.toggle('active',l==='desktop');
  document.getElementById('seg-mobile').classList.toggle('active',l==='mobile');
  localStorage.setItem('layout',l);
}
(function(){
  setTheme(localStorage.getItem('theme')||'light');
  const saved=localStorage.getItem('layout');
  setLayout(saved||(window.innerWidth<=430?'mobile':'desktop'));
})();

// ── Auth ──
let authMode='login';
function switchAuthTab(m){
  authMode=m;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&m==='login')||(i===1&&m==='signup')));
  document.getElementById('auth-submit').textContent=m==='login'?'로그인':'회원가입';
  document.getElementById('auth-name-wrap').style.display=m==='signup'?'block':'none';
  document.getElementById('auth-err').textContent='';
}
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pw=document.getElementById('auth-pw').value;
  const err=document.getElementById('auth-err');
  err.textContent='';
  if(!email||!pw){err.textContent='이메일과 비밀번호를 입력해주세요.';return;}
  try{
    if(authMode==='login'){await auth.signInWithEmailAndPassword(email,pw);}
    else{const name=document.getElementById('auth-name').value.trim()||email.split('@')[0];const c=await auth.createUserWithEmailAndPassword(email,pw);await c.user.updateProfile({displayName:name});}
  }catch(e){
    const msgs={'auth/user-not-found':'등록되지 않은 이메일입니다.','auth/wrong-password':'비밀번호가 틀렸습니다.','auth/email-already-in-use':'이미 사용 중인 이메일입니다.','auth/weak-password':'비밀번호는 6자 이상이어야 합니다.','auth/invalid-email':'이메일 형식이 올바르지 않습니다.'};
    err.textContent=msgs[e.code]||e.message;
  }
}
async function doLogout(){
  if(!confirm('로그아웃 하시겠어요?'))return;
  unsubscribers.forEach(u=>u());unsubscribers=[];
  await auth.signOut();
}
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app-shell').style.display='flex';
    const init=(user.displayName||user.email||'?')[0].toUpperCase();
    document.getElementById('settings-avatar').textContent=init;
    document.getElementById('settings-name').textContent=user.displayName||'사용자';
    document.getElementById('settings-email').textContent=user.email;
    initData();
  }else{
    currentUser=null;
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app-shell').style.display='none';
    projects=[];todayTasksByDate={};calEvents=[];tsRows=[];
  }
});

// ── Firestore ──
function setSyncing(v){
  ['sync-dot','sync-dot2'].forEach(id=>{const d=document.getElementById(id);if(d)d.className='sync-dot'+(v?' syncing':'');});
  const lbl=document.getElementById('sync-label');if(lbl)lbl.textContent=v?'저장 중...':'동기화됨';
}
function uCol(col){return db.collection('users').doc(currentUser.uid).collection(col);}
async function fsAdd(col,data){setSyncing(true);try{return await uCol(col).add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}finally{setTimeout(()=>setSyncing(false),600);}}
async function fsUpdate(col,id,data){setSyncing(true);try{await uCol(col).doc(id).update(data);}finally{setTimeout(()=>setSyncing(false),600);}}
async function fsDelete(col,id){setSyncing(true);try{await uCol(col).doc(id).delete();}finally{setTimeout(()=>setSyncing(false),600);}}

function initData(){
  unsubscribers.forEach(u=>u());unsubscribers=[];
  unsubscribers.push(uCol('projects').orderBy('createdAt').onSnapshot(s=>{projects=s.docs.map(d=>({...d.data(),id:d.id}));renderProjects();updateTsSelect();}));
  unsubscribers.push(uCol('todayTasks').onSnapshot(s=>{todayTasksByDate={};s.docs.forEach(d=>{const t=d.data();if(!todayTasksByDate[t.dateKey])todayTasksByDate[t.dateKey]=[];todayTasksByDate[t.dateKey].push({...t,id:d.id});});renderToday();renderCompletedTasks();}));
  unsubscribers.push(uCol('calEvents').orderBy('date').onSnapshot(s=>{calEvents=s.docs.map(d=>({...d.data(),id:d.id}));renderCal();}));
  unsubscribers.push(uCol('tsRows').orderBy('date').onSnapshot(s=>{tsRows=s.docs.map(d=>({...d.data(),id:d.id}));renderTs();updateTsBar();}));
  document.getElementById('ts-date').valueAsDate=new Date();
  renderToday();renderTaskDateLabel();updateTsBar();
}

// ── Color ──
const CAT_COLORS=['#5B8DEF','#E8735A','#53B99A','#B87DDA','#F2AE3D','#60B5D1','#E47DA0','#7DB87D','#A0856C','#6C8EAD'];
const catMap={};let catIdx=0;
function gc(cat){const k=(cat||'기타').trim();if(!catMap[k]){catMap[k]=CAT_COLORS[catIdx%CAT_COLORS.length];catIdx++;}return catMap[k];}

let projects=[],todayTasksByDate={},calEvents=[],tsRows=[];
let calDate=new Date(),selectedCalDate=null,dragTask=null;
let expandedProjs=new Set(),collapsedSt=new Set();
let activeFilter='전체';
const todayD=new Date();todayD.setHours(0,0,0,0);
let taskViewDate=new Date(todayD);

function dk(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isT(d){return dk(d)===dk(todayD);}
function fmtD(d){const days=['일','월','화','수','목','금','토'];return`${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;}
function fmtFull(ds){const[y,m,d]=ds.split('-');return`${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;}
const ST={active:{label:'진행',cls:'s-active'},done:{label:'완료',cls:'s-done'},hold:{label:'보류',cls:'s-hold'},issue:{label:'차질',cls:'s-issue'},prev:{label:'전임자 업무',cls:'s-prev'}};

function switchTab(t,btn){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll(`[data-tab="${t}"]`).forEach(b=>b.classList.add('active'));
  if(t==='calendar')renderCal();
  if(t==='timesheet'){renderTs();updateTsBar();renderCompletedTasks();}
}

// ── PROJECT ──
function getFilteredProjects(){
  let list=[...projects];
  if(activeFilter!=='전체')list=list.filter(p=>p.cat===activeFilter);
  // 분류 기준 내림차순(가나다 역순)
  list.sort((a,b)=>(b.cat||'').localeCompare(a.cat||'','ko'));
  return list;
}

function renderFilterBar(){
  const cats=['전체',...[...new Set(projects.map(p=>p.cat||'기타'))].sort((a,b)=>b.localeCompare(a,'ko'))];
  const bar=document.getElementById('proj-filter-bar');
  bar.innerHTML=cats.map(c=>`<button class="filter-chip ${activeFilter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');
}
function setFilter(cat){activeFilter=cat;renderProjects();}

function renderProjects(){
  renderFilterBar();
  const body=document.getElementById('proj-body');if(!body)return;
  const filtered=getFilteredProjects();
  const groups={active:[],done:[],hold:[],issue:[],prev:[]};
  filtered.forEach(p=>{if(groups[p.status])groups[p.status].push(p);});
  let html='';
  ['active','done','hold','issue','prev'].forEach(st=>{
    const list=groups[st],sm=ST[st],col=collapsedSt.has(st);
    if(!list.length)return;
    html+=`<div class="status-section"><div class="status-hdr" onclick="toggleSt('${st}')"><span class="status-label ${sm.cls}">${sm.label} ${list.length}</span><span class="toggle-arrow ${col?'collapsed':''}">▾</span></div>`;
    if(!col)list.forEach(p=>{
      const c=gc(p.cat),open=expandedProjs.has(p.id);
      html+=`<div class="proj-row" style="border-left-color:${c}"><div class="proj-row-header" onclick="toggleProj('${p.id}')">
        <span class="proj-cat-badge" style="background:${c}18;color:${c}">${p.cat||'기타'}</span>
        <span class="proj-name-text">${p.name}</span>
        <div class="proj-row-actions" onclick="event.stopPropagation()">
          <button class="action-btn" onclick="openEditProject('${p.id}')">편집</button>
          <button class="action-btn" style="color:#e53935" onclick="delProj('${p.id}')">삭제</button>
        </div>
        <span class="proj-expand ${open?'open':''}">▶</span>
      </div>${open?renderPD(p):''}</div>`;
    });
    html+='</div>';
  });
  if(!html)html=`<div style="font-size:12px;color:var(--text3);text-align:center;padding:24px">등록된 프로젝트가 없습니다</div>`;
  body.innerHTML=html;setupDrop();
}

function renderPD(p){
  const c=gc(p.cat);
  // 담당자 (배열 또는 구버전 문자열 호환)
  const members=Array.isArray(p.members)?p.members:(p.owner?[p.owner]:[]);
  const memberHtml=members.length?members.join(', '):'-';
  // 선행 프로젝트 이름
  const preLabel=p.pre?getPL(p.pre):'-';
  // 하위 항목: 분류 기준 내림차순 그룹
  const subs=[...(p.subtasks||[])];
  subs.sort((a,b)=>(b.cat||'').localeCompare(a.cat||'','ko'));
  const catGroups={};
  subs.forEach((s,origIdx)=>{
    const key=s.cat||'기타';
    if(!catGroups[key])catGroups[key]=[];
    catGroups[key].push({...s,origIdx});
  });
  const catKeys=Object.keys(catGroups).sort((a,b)=>b.localeCompare(a,'ko'));
  let subsHtml=catKeys.map(cat=>{
    const items=catGroups[cat].map(s=>`
      <div class="subtask-item" draggable="true" ondragstart="dragStart('${p.id}',${s.origIdx},event)">
        <span class="subtask-drag">⠿</span>
        <div class="subtask-check ${s.done?'done':''}" onclick="toggleSub('${p.id}',${s.origIdx})"></div>
        <div class="subtask-info"><div class="subtask-text ${s.done?'done':''}">${s.text}</div></div>
        <button class="subtask-del" onclick="delSub('${p.id}',${s.origIdx})">×</button>
      </div>`).join('');
    return`<div class="subtask-group-label">${cat}</div>${items}`;
  }).join('');
  if(!subsHtml)subsHtml='<div style="font-size:11px;color:var(--text3);padding:4px 0 6px">하위 항목 없음</div>';
  return`<div class="proj-detail">
    <div class="proj-detail-grid">
      <div class="proj-detail-item"><span class="proj-detail-label">프로젝트 번호</span><span class="proj-detail-val"><span class="proj-number-tag">${p.number||'-'}</span></span></div>
      <div class="proj-detail-item"><span class="proj-detail-label">담당자</span><span class="proj-detail-val">${memberHtml}</span></div>
      <div class="proj-detail-item"><span class="proj-detail-label">기간</span><span class="proj-detail-val">${p.start||'-'} ~ ${p.end||'-'}</span></div>
      <div class="proj-detail-item"><span class="proj-detail-label">선행 프로젝트</span><span class="proj-detail-val">${preLabel}</span></div>
    </div>
    <div class="subtask-list">${subsHtml}</div>
    <div class="subtask-add-row">
      <input class="subtask-input-sm" id="sic-${p.id}" placeholder="분류">
      <input class="subtask-input-lg" id="sit-${p.id}" placeholder="세부내용" onkeydown="if(event.key==='Enter')addSub('${p.id}')">
      <button class="subtask-add-btn" onclick="addSub('${p.id}')">추가</button>
    </div>
  </div>`;
}

function getPL(id){const p=projects.find(x=>x.id===id);return p?`${p.number} ${p.name}`:'?';}
function toggleSt(st){collapsedSt.has(st)?collapsedSt.delete(st):collapsedSt.add(st);renderProjects();}
function toggleProj(id){expandedProjs.has(id)?expandedProjs.delete(id):expandedProjs.add(id);renderProjects();}

async function addSub(pid){
  const cat=document.getElementById('sic-'+pid),txt=document.getElementById('sit-'+pid);
  if(!txt||!txt.value.trim())return;
  const p=projects.find(x=>x.id===pid);if(!p)return;
  await fsUpdate('projects',pid,{subtasks:[...(p.subtasks||[]),{cat:cat?cat.value.trim():'',text:txt.value.trim(),done:false}]});
}
async function toggleSub(pid,idx){
  const p=projects.find(x=>x.id===pid);if(!p)return;
  const s=[...(p.subtasks||[])];s[idx]={...s[idx],done:!s[idx].done};
  await fsUpdate('projects',pid,{subtasks:s});
}
async function delSub(pid,idx){
  const p=projects.find(x=>x.id===pid);if(!p)return;
  await fsUpdate('projects',pid,{subtasks:(p.subtasks||[]).filter((_,i)=>i!==idx)});
}
async function delProj(id){if(!confirm('삭제할까요?'))return;expandedProjs.delete(id);await fsDelete('projects',id);}
function dragStart(pid,idx,e){dragTask={pid,idx};e.stopPropagation();}
function setupDrop(){
  const body=document.getElementById('today-body');if(!body)return;
  body.ondragover=e=>{e.preventDefault();const dz=body.querySelector('.drop-zone');if(dz)dz.classList.add('drag-over');};
  body.ondragleave=()=>{const dz=body.querySelector('.drop-zone');if(dz)dz.classList.remove('drag-over');};
  body.ondrop=async e=>{
    e.preventDefault();
    const dz=body.querySelector('.drop-zone');if(dz)dz.classList.remove('drag-over');
    if(!dragTask)return;
    const p=projects.find(x=>x.id===dragTask.pid);if(!p)return;
    const sub=(p.subtasks||[])[dragTask.idx];if(!sub)return;
    const key=dk(taskViewDate);
    await fsAdd('todayTasks',{text:sub.text,subCat:sub.cat||'',projId:p.id,projName:p.name,projColor:gc(p.cat),done:false,dateKey:key});
    dragTask=null;
  };
}

// 담당자 임시 목록 (모달용)
let tempMembers=[];
function renderMemberTags(){
  const ml=document.getElementById('member-list');if(!ml)return;
  ml.innerHTML=tempMembers.map((m,i)=>`<span class="member-tag">${m}<button onclick="removeMember(${i})">×</button></span>`).join('');
}
function addMemberFromInput(){
  const inp=document.getElementById('member-input');if(!inp)return;
  const val=inp.value.trim();if(!val)return;
  if(!tempMembers.includes(val))tempMembers.push(val);
  inp.value='';renderMemberTags();
}
function removeMember(i){tempMembers.splice(i,1);renderMemberTags();}

function openAddProject(){showProjModal(null);}
function openEditProject(id){showProjModal(projects.find(x=>x.id===id));}

  tempMembers=isEdit&&Array.isArray(p.members)?[...p.members]:(isEdit&&p.owner?[p.owner]:[]);
  const preOpts=projects.filter(x=>!p||x.id!==p.id).map(x=>`<option value="${x.id}" ${p&&p.pre===x.id?'selected':''}>${x.number} ${x.name}</option>`).join('');
  showModal(`<h3>${isEdit?'프로젝트 편집':'프로젝트 추가'}</h3>
    <div class="form-2col">
      <div class="form-row"><label>프로젝트 번호</label><input id="f-no" value="${p?p.number:''}" placeholder="P-001"></div>
      <div class="form-row"><label>분류</label><input id="f-cat" value="${p?p.cat:''}" placeholder="개발, 디자인..."></div>
    </div>
    <div class="form-row"><label>프로젝트명</label><input id="f-name" value="${p?p.name:''}" placeholder="프로젝트명 입력"></div>
    <div class="form-row">
      <label>담당자 (여러 명 추가 가능)</label>
      <div class="member-list" id="member-list"></div>
      <div class="member-add-row">
        <input id="member-input" placeholder="이름/직급 입력 후 추가" onkeydown="if(event.key==='Enter'){event.preventDefault();addMemberFromInput()}">
        <button onclick="addMemberFromInput()">추가</button>
      </div>
    </div>
    <div class="form-2col">
      <div class="form-row"><label>시작일</label><input type="date" id="f-start" value="${p?p.start:''}"></div>
      <div class="form-row"><label>종료일</label><input type="date" id="f-end" value="${p?p.end:''}"></div>
    </div>
    <div class="form-2col">
      <div class="form-row"><label>진행상태</label>
        <select id="f-st">
          <option value="active" ${!p||p.status==='active'?'selected':''}>진행</option>
          <option value="done" ${p&&p.status==='done'?'selected':''}>완료</option>
          <option value="hold" ${p&&p.status==='hold'?'selected':''}>보류</option>
          <option value="issue" ${p&&p.status==='issue'?'selected':''}>차질</option>
          <option value="prev" ${p&&p.status==='prev'?'selected':''}>전임자 업무</option>
        </select>
      </div>
      <div class="form-row"><label>선행 프로젝트</label>
        <select id="f-pre"><option value="">없음</option>${preOpts}</select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveProj('${isEdit?p.id:'null'}')">${isEdit?'저장':'추가'}</button>
    </div>`);
  renderMemberTags();
}
async function saveProj(editId){
  const name=v('f-name');if(!name)return alert('프로젝트명을 입력해주세요.');
  const data={number:v('f-no')||`P-${String(projects.length+1).padStart(3,'0')}`,name,cat:v('f-cat'),members:tempMembers,start:v('f-start'),end:v('f-end'),status:v('f-st'),pre:v('f-pre')||null};
  if(editId!=='null')await fsUpdate('projects',editId,data);
  else await fsAdd('projects',{...data,subtasks:[]});
  closeModal();
}

// ── TODAY TASK ──
function renderTaskDateLabel(){
  const lbl=document.getElementById('task-date-label');if(!lbl)return;
  lbl.innerHTML=`${fmtD(taskViewDate)}${isT(taskViewDate)?'<span class="date-today-badge">오늘</span>':''}`;
}
function changeTaskDate(d){taskViewDate=new Date(taskViewDate);taskViewDate.setDate(taskViewDate.getDate()+d);renderTaskDateLabel();renderToday();}
function goTodayDate(){taskViewDate=new Date(todayD);renderTaskDateLabel();renderToday();}
function renderToday(){
  renderTaskDateLabel();
  const body=document.getElementById('today-body');if(!body)return;
  const key=dk(taskViewDate),tasks=todayTasksByDate[key]||[];
  const items=tasks.map(t=>`<div class="today-card" style="border-left-color:${t.projColor}">
    <div class="today-check ${t.done?'checked':''}" onclick="toggleT('${t.id}',${!t.done})"></div>
    <div style="flex:1;min-width:0">
      ${t.subCat?`<div style="font-size:9px;color:var(--text3);margin-bottom:1px">${t.subCat}</div>`:''}
      <div class="today-text ${t.done?'checked':''}">${t.text}</div>
      <span class="today-proj-tag" style="background:${t.projColor}22;color:${t.projColor}">${t.projName}</span>
    </div>
    <button class="del-btn" onclick="delT('${t.id}')">×</button>
  </div>`).join('');
  body.innerHTML=items+`<div class="drop-zone">하위 항목을 여기로 드래그하세요</div>`;
  setupDrop();
}
async function toggleT(id,val){await fsUpdate('todayTasks',id,{done:val});}
async function delT(id){await fsDelete('todayTasks',id);}

function openAddTodayTask(){
  const pOpts=projects.map(p=>`<option value="${p.id}">${p.number||''} ${p.name}</option>`).join('');
  showModal(`<h3>Today Task 추가</h3>
    <div class="form-row"><label>세부내용</label><input id="f-tt" placeholder="세부내용 입력"></div>
    <div class="form-row"><label>분류</label><input id="f-tc" placeholder="분류 입력"></div>
    <div class="form-row"><label>프로젝트</label><select id="f-tp"><option value="">없음</option>${pOpts}</select></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveTT()">저장</button>
    </div>`);
}
async function saveTT(){
  const text=v('f-tt');if(!text)return;
  const pid=v('f-tp'),p=projects.find(x=>x.id===pid);
  const cat=v('f-tc');
  const key=dk(taskViewDate);
  // TODAY TASK 저장
  await fsAdd('todayTasks',{text,subCat:cat,projId:pid||null,projName:p?p.name:'기타',projColor:p?gc(p.cat):'#999',done:false,dateKey:key});
  // 프로젝트 하위 항목으로도 자동 추가
  if(p){
    const exists=(p.subtasks||[]).some(s=>s.text===text&&s.cat===cat);
    if(!exists)await fsUpdate('projects',pid,{subtasks:[...(p.subtasks||[]),{cat:cat||'',text,done:false}]});
  }
  closeModal();
}

// ── CALENDAR ──
function renderCal(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  document.getElementById('cal-month-label').textContent=`${y}년 ${m+1}월`;
  const days=['일','월','화','수','목','금','토'];
  let html=days.map(d=>`<div class="cal-day-hdr">${d}</div>`).join('');
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),td=new Date();
  for(let i=0;i<first;i++){const d=new Date(y,m,-first+1+i);html+=`<div class="cal-cell other-month"><div class="cal-date">${d.getDate()}</div></div>`;}
  for(let d=1;d<=last;d++){
    const isTd=td.getFullYear()===y&&td.getMonth()===m&&td.getDate()===d;
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evts=calEvents.filter(e=>e.date===ds);
    const isSel=selectedCalDate===ds;
    // 셀 내 요약: 최대 2개 표시
    const previews=evts.slice(0,2).map(e=>`<div class="cal-evt-preview" style="background:${e.color}22;color:${e.color}">${e.title}</div>`).join('');
    const more=evts.length>2?`<div style="font-size:8px;color:var(--text3);padding:0 2px">+${evts.length-2}개</div>`:'';
    html+=`<div class="cal-cell ${isTd?'today':''} ${isSel?'selected':''}" onclick="selCal('${ds}')">
      <div class="cal-date">${d}</div>
      ${previews}${more}
    </div>`;
  }
  const rem=(7-((first+last)%7))%7;
  for(let i=1;i<=rem;i++)html+=`<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
  document.getElementById('cal-grid').innerHTML=html;
  renderCalDetail();
}
function selCal(ds){selectedCalDate=selectedCalDate===ds?null:ds;renderCal();}
function renderCalDetail(){
  const det=document.getElementById('cal-detail');
  if(!selectedCalDate){det.innerHTML='<div class="cal-detail-empty">날짜를 선택하면 일정이 표시됩니다</div>';return;}
  const evts=calEvents.filter(e=>e.date===selectedCalDate);
  let html=`<div class="cal-detail-header"><span class="cal-detail-title">${fmtFull(selectedCalDate)}</span><button class="icon-btn" onclick="openAddEventDate('${selectedCalDate}')" style="font-size:10px;padding:3px 8px">+ 추가</button></div>`;
  if(!evts.length)html+='<div class="cal-detail-empty">등록된 일정이 없습니다</div>';
  else html+=evts.map(e=>`
    <div class="cal-detail-item" style="border-left-color:${e.color}">
      <div style="flex:1;min-width:0">
        <div class="cal-detail-item-title">${e.title}</div>
        ${e.projName?`<div style="font-size:10px;color:var(--text3);margin-top:1px">${e.projName}</div>`:''}
        ${e.memo?`<div style="font-size:11px;color:var(--text2);margin-top:2px">${e.memo}</div>`:''}
        ${e.startTime||e.endTime?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${e.startTime||''}${e.endTime?' ~ '+e.endTime:''}</div>`:''}
      </div>
      <div class="cal-detail-actions">
        <button class="cal-detail-btn" onclick="openEditEvent('${e.id}')">편집</button>
        <button class="cal-detail-del" onclick="delEvt('${e.id}')">×</button>
      </div>
    </div>`).join('');
  det.innerHTML=html;
}
function changeMonth(d){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+d,1);renderCal();}

function openAddEvent(date){showEventModal(null,date);}
function openAddEventDate(ds){showEventModal(null,ds);}
function openEditEvent(id){showEventModal(calEvents.find(e=>e.id===id));}

function showEventModal(ev,date){
  const isEdit=!!ev;
  const pOpts=projects.map(p=>`<option value="${p.id}" ${ev&&ev.projId===p.id?'selected':''}>${p.number||''} ${p.name}</option>`).join('');
  showModal(`<h3>일정 ${isEdit?'편집':'추가'}</h3>
    <div class="form-row"><label>제목</label><input id="f-et" value="${ev?ev.title:''}" placeholder="일정 제목"></div>
    <div class="form-row"><label>날짜</label><input type="date" id="f-ed" value="${ev?ev.date:(date||selectedCalDate||'')}"></div>
    <div class="form-2col">
      <div class="form-row"><label>시작 시간</label><input type="time" id="f-es" value="${ev?ev.startTime||'':''}"></div>
      <div class="form-row"><label>종료 시간</label><input type="time" id="f-ee" value="${ev?ev.endTime||'':''}"></div>
    </div>
    <div class="form-row"><label>메모</label><textarea id="f-em">${ev?ev.memo||'':''}</textarea></div>
    <div class="form-row"><label>프로젝트 (색상 연동)</label><select id="f-ep"><option value="">없음</option>${pOpts}</select></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEvt('${isEdit?ev.id:'null'}')">${isEdit?'저장':'추가'}</button>
    </div>`);
}
async function saveEvt(editId){
  const title=v('f-et'),date=v('f-ed');if(!title||!date)return alert('제목과 날짜를 입력해주세요.');
  const p=projects.find(x=>x.id===v('f-ep'));
  const data={title,date,startTime:v('f-es'),endTime:v('f-ee'),memo:v('f-em'),color:p?gc(p.cat):'#888',projName:p?`${p.number||''} ${p.name}`:'',projId:p?p.id:null};
  if(editId!=='null')await fsUpdate('calEvents',editId,data);
  else await fsAdd('calEvents',data);
  closeModal();selectedCalDate=date;renderCal();
}
async function delEvt(id){if(confirm('삭제할까요?')){await fsDelete('calEvents',id);renderCal();}}

// ── TIMESHEET ──
function updateTsSelect(){
  const sel=document.getElementById('ts-pname');if(!sel)return;
  const cur=sel.value;
  sel.innerHTML='<option value="">선택</option>'+projects.map(p=>`<option value="${p.id}">${p.number||''} ${p.name}</option>`).join('');
  if(cur)sel.value=cur;
}
function syncTsNo(){const p=projects.find(x=>x.id===document.getElementById('ts-pname').value);document.getElementById('ts-pno').value=p?p.number:'';}
function renderCompletedTasks(){
  const wrap=document.getElementById('ts-completed-wrap'),list=document.getElementById('ts-completed-list');
  if(!wrap||!list)return;
  const pid=document.getElementById('ts-pname').value,ds=document.getElementById('ts-date').value;
  if(!pid||!ds){wrap.style.display='none';return;}
  const done=(todayTasksByDate[ds]||[]).filter(t=>t.done&&t.projId===pid);
  if(!done.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  list.innerHTML=done.map(t=>`<div class="ts-completed-item" onclick="selComp(this,'${t.text.replace(/'/g,"\\'")}','${(t.subCat||'').replace(/'/g,"\\'")}')">
    <div class="ts-completed-check"></div>
    <div style="flex:1;min-width:0">
      ${t.subCat?`<div style="font-size:9px;color:var(--text3)">${t.subCat}</div>`:''}
      <div class="ts-completed-text">${t.text}</div>
    </div>
  </div>`).join('');
}
function selComp(el,text,cat){
  document.querySelectorAll('.ts-completed-item').forEach(i=>i.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('ts-memo').value=cat?`[${cat}] ${text}`:text;
}
function getUsed(ds){return tsRows.filter(r=>r.date===ds).reduce((s,r)=>s+r.hours,0);}
function updateTsBar(){
  const ds=document.getElementById('ts-date').value,used=getUsed(ds),rem=Math.max(0,8-used),pct=Math.min(100,Math.round((used/8)*100));
  const fill=document.getElementById('ts-bar-fill'),lbl=document.getElementById('ts-bar-label');
  if(fill){fill.style.width=pct+'%';fill.style.background=pct>=100?'#E8735A':pct>=75?'#F2AE3D':'#53B99A';}
  if(lbl)lbl.innerHTML=pct>=100?'<b style="color:#E8735A">8h 모두 사용</b>':`<b>${rem}h</b> 남음`;
}
async function addTsRow(){
  const date=document.getElementById('ts-date').value,pid=document.getElementById('ts-pname').value;
  const hours=parseFloat(document.getElementById('ts-hours').value),memo=document.getElementById('ts-memo').value.trim();
  if(!date||!pid||!hours)return alert('업무일, 프로젝트, 사용시간을 입력해주세요.');
  const used=getUsed(date);
  if(used+hours>8)return alert(`해당 날짜에 ${8-used}h만 더 입력 가능합니다.`);
  const p=projects.find(x=>x.id===pid);
  await fsAdd('tsRows',{date,pno:p?p.number:'',pname:p?p.name:'',hours,memo,color:p?gc(p.cat):'#888'});
  document.getElementById('ts-hours').value='';
  document.getElementById('ts-memo').value='';
  document.querySelectorAll('.ts-completed-item').forEach(i=>i.classList.remove('selected'));
}
function renderTs(){
  updateTsSelect();
  const tbody=document.getElementById('ts-tbody');if(!tbody)return;
  if(!tsRows.length){tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">입력된 내역이 없습니다</td></tr>`;document.getElementById('ts-total').textContent='';return;}
  tbody.innerHTML=[...tsRows].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<tr>
    <td>${r.date}</td>
    <td><span style="font-family:monospace;font-size:11px;background:var(--surface2);padding:2px 5px;border-radius:3px;color:var(--text2)">${r.pno||'-'}</span></td>
    <td><span style="display:inline-flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:${r.color};display:inline-block"></span>${r.pname}</span></td>
    <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.memo||''}">${r.memo||'-'}</td>
    <td><b>${r.hours}h</b></td>
    <td><button class="del-btn" onclick="delTs('${r.id}')">×</button></td>
  </tr>`).join('');
  document.getElementById('ts-total').innerHTML=`총 사용시간 <span>${tsRows.reduce((s,r)=>s+r.hours,0)}h</span>`;
}
async function delTs(id){await fsDelete('tsRows',id);}

// ── MODAL ──
function showModal(html){document.getElementById('modal-box').innerHTML='<div class="modal-drag"></div>'+html;document.getElementById('modal').style.display='flex';}
function closeModal(e){if(!e||e.target===document.getElementById('modal'))document.getElementById('modal').style.display='none';}
function v(id){return(document.getElementById(id)||{}).value||'';}
</script>
</body>
</html>
